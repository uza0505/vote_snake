<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>강의 만족도 조사 & 뱀게임</title>

<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#111,#333);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  .container{
    width:1000px;
    height:600px;
    background:#f5f5f7;
    border-radius:30px;
    overflow:hidden;
    display:flex;
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
  }

  .left,
  .right{
    width:50%;
    padding:35px;
    box-sizing:border-box;
  }

  .left{
    border-right:1px solid #ddd;
  }

  h1{
    text-align:center;
    margin-bottom:30px;
    color:#111;
  }

  .buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:35px;
  }

  button{
    border:none;
    border-radius:18px;
    padding:16px 28px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
  }

  button:hover{
    transform:translateY(-3px);
  }

  .good{
    background:#111;
    color:white;
  }

  .bad{
    background:#d9d9d9;
    color:#111;
  }

  .label{
    display:flex;
    justify-content:space-between;
    margin:18px 0 8px;
    font-weight:bold;
    color:#111;
  }

  .bar-bg{
    width:100%;
    height:28px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
  }

  .bar{
    height:100%;
    width:0%;
    transition:0.4s;
  }

  #goodBar{
    background:#111;
  }

  #badBar{
    background:#777;
  }

  .total{
    margin-top:25px;
    text-align:center;
    color:#555;
    font-size:15px;
  }

  .game-title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
    color:#111;
  }

  .score{
    text-align:center;
    margin-bottom:15px;
    font-size:18px;
    font-weight:bold;
    color:#111;
  }

  canvas{
    background:#111;
    display:block;
    margin:0 auto;
    border-radius:20px;
  }

  .guide{
    text-align:center;
    margin-top:15px;
    color:#666;
    font-size:14px;
  }

</style>
</head>

<body>

<div class="container">

  <!-- 왼쪽 -->
  <div class="left">

    <h1>강의 만족도 조사</h1>

    <div class="buttons">
      <button class="good" onclick="vote('good')">만족</button>
      <button class="bad" onclick="vote('bad')">불만족</button>
    </div>

    <div class="label">
      <span>만족</span>
      <span id="goodCount">0명</span>
    </div>

    <div class="bar-bg">
      <div class="bar" id="goodBar"></div>
    </div>

    <div class="label">
      <span>불만족</span>
      <span id="badCount">0명</span>
    </div>

    <div class="bar-bg">
      <div class="bar" id="badBar"></div>
    </div>

    <div class="total" id="totalCount">
      총 응답 수 : 0명
    </div>

  </div>

  <!-- 오른쪽 -->
  <div class="right">

    <div class="game-title">🐍 뱀게임</div>

    <div class="score">
      점수 : <span id="score">0</span>
    </div>

    <canvas id="game" width="360" height="360"></canvas>

    <div class="guide">
      방향키로 움직이세요
    </div>

  </div>

</div>

<script>

  // =========================
  // 만족도 조사
  // =========================

  let good = 0;
  let bad = 0;

  function vote(type){

    if(type === "good"){
      good++;
    }else{
      bad++;
    }

    updateChart();
  }

  function updateChart(){

    const total = good + bad;

    const goodPercent =
      total === 0 ? 0 : (good / total) * 100;

    const badPercent =
      total === 0 ? 0 : (bad / total) * 100;

    document.getElementById("goodCount").innerText =
      good + "명";

    document.getElementById("badCount").innerText =
      bad + "명";

    document.getElementById("totalCount").innerText =
      "총 응답 수 : " + total + "명";

    document.getElementById("goodBar").style.width =
      goodPercent + "%";

    document.getElementById("badBar").style.width =
      badPercent + "%";
  }

  // =========================
  // 뱀게임
  // =========================

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const box = 20;

  let snake = [
    {x:180, y:180}
  ];

  let food = randomFood();

  let dx = box;
  let dy = 0;

  let score = 0;

  function randomFood(){

    return{
      x: Math.floor(Math.random()*18)*box,
      y: Math.floor(Math.random()*18)*box
    };
  }

  document.addEventListener("keydown", direction);

  function direction(event){

    if(event.key === "ArrowUp" && dy === 0){
      dx = 0;
      dy = -box;
    }

    else if(event.key === "ArrowDown" && dy === 0){
      dx = 0;
      dy = box;
    }

    else if(event.key === "ArrowLeft" && dx === 0){
      dx = -box;
      dy = 0;
    }

    else if(event.key === "ArrowRight" && dx === 0){
      dx = box;
      dy = 0;
    }
  }

  function collision(head, array){

    for(let i=0; i<array.length; i++){

      if(head.x === array[i].x &&
         head.y === array[i].y){

        return true;
      }
    }

    return false;
  }

  function draw(){

    // 배경
    ctx.fillStyle = "#111";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // 먹이
    ctx.fillStyle = "#888";

    ctx.beginPath();
    ctx.arc(
      food.x + 10,
      food.y + 10,
      8,
      0,
      Math.PI * 2
    );
    ctx.fill();

    // 뱀
    ctx.fillStyle = "white";

    snake.forEach((part,index)=>{

      if(index === 0){
        ctx.fillStyle = "#ffffff";
      }else{
        ctx.fillStyle = "#bbbbbb";
      }

      ctx.fillRect(
        part.x,
        part.y,
        box - 2,
        box - 2
      );
    });

    // 머리 이동
    let headX = snake[0].x + dx;
    let headY = snake[0].y + dy;

    let newHead = {
      x:headX,
      y:headY
    };

    // 벽 충돌
    if(
      headX < 0 ||
      headY < 0 ||
      headX >= canvas.width ||
      headY >= canvas.height ||
      collision(newHead,snake)
    ){

      // 초기화 후 계속 진행
      snake = [
        {x:180,y:180}
      ];

      dx = box;
      dy = 0;

      score = 0;

      document.getElementById("score").innerText =
        score;

      food = randomFood();

      return;
    }

    snake.unshift(newHead);

    // 먹이 먹기
    if(headX === food.x && headY === food.y){

      score++;

      document.getElementById("score").innerText =
        score;

      food = randomFood();

    }else{

      snake.pop();
    }
  }

  setInterval(draw,120);

</script>

</body>
</html>
